<style>

*{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}

.orb:active{cursor:grabbing}.orb::after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 0 30px rgba(178,235,193,.06)}.cursor{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 72%,transparent);transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}.orb-labels{position:absolute;inset:0;pointer-events:none}.orb-labels span{position:absolute;font-size:10px;line-height:1;letter-spacing:.08em;color:color-mix(in srgb,var(--text) 58%,transparent);text-transform:uppercase;white-space:nowrap}.l{left:18px;top:50%;transform:translateY(-50%)}.r{right:18px;top:50%;transform:translateY(-50%)}.t{top:18px;left:50%;transform:translateX(-50%)}.b{bottom:18px;left:50%;transform:translateX(-50%)}

@media(max-width:700px){.app{min-height:500px}.topbar{left:12px;right:12px;top:12px;align-items:flex-start}.brand{padding-top:9px}.controls{max-width:72%}.controls button,.controls select{padding:7px 9px}.center{inset:105px 0 300px}.orb{width:220px;height:220px}.bottom{bottom:10px;grid-template-columns:repeat(2,1fr);gap:10px;border-radius:18px}.master{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:9px 0 0}.param-head,.master label{margin-bottom:4px}.sound-editor{grid-template-columns:1fr}}

<title>KAKUNTE</title>

<body>

<div class="app" id="app" data-mobile-view="scene">
  <canvas id="forest"></canvas><div class="veil"></div>
  <div class="topbar">
    <div class="brand">KAKUNTE</div>
    <div class="controls">
      <select id="preset" aria-label="Preset by time of day">
        <option value="__custom__" id="customPresetOption" disabled hidden>Custom Drift</option>
        <optgroup label="Dawn"><option>Misty Lake</option><option>Quiet Shrine</option><option>First Light</option><option>Blue Hour</option><option>Dew Awakening</option></optgroup>
        <optgroup label="Morning"><option selected>Morning Forest</option><option>After Rain</option><option>Rainy Woods</option><option>Cedar Morning</option><option>Birdsong Clearing</option></optgroup>
        <optgroup label="Day"><option>Sunlit Canopy</option><option>Autumn Creek</option><option>Green Cathedral</option><option>River Canopy</option><option>Summer Shade</option></optgroup>
        <optgroup label="Evening"><option>Ancient Forest</option><option>Moss Temple</option><option>Amber Grove</option><option>Golden Mist</option><option>Dusk Creek</option></optgroup>
        <optgroup label="Night"><option>Deep Night</option><option>Moonlit Pines</option><option>Fog Valley</option><option>Starless Woods</option><option>Midnight Rain</option></optgroup>
      </select>
      <select id="key" aria-label="Key"><option value="0">C</option><option value="1">C♯</option><option value="2" selected>D</option><option value="3">D♯</option><option value="4">E</option><option value="5">F</option><option value="6">F♯</option><option value="7">G</option><option value="8">G♯</option><option value="9">A</option><option value="10">A♯</option><option value="11">B</option></select>
      <select id="scale" aria-label="Electronic scale"><option value="minor-pent">Minor Pent.</option><option value="major-pent">Major Pent.</option><option value="major">Major</option><option value="natural-minor">Natural Minor</option><option value="dorian">Dorian</option><option value="mixolydian">Mixolydian</option><option value="lydian">Lydian</option><option value="phrygian">Phrygian</option><option value="harmonic-minor">Harmonic Minor</option><option value="insen">In Sen</option><option value="whole-tone">Whole Tone</option></select>
      <select id="randomScope" aria-label="Randomize time"><option value="all">All Time</option><option value="dawn">Dawn</option><option value="morning">Morning</option><option value="day">Day</option><option value="evening">Evening</option><option value="night">Night</option></select><button id="randomize">Randomize</button><button id="save">Save</button><button id="load">Load</button><button id="transport">Stop</button>
    </div>
  </div>
  <div class="center"><div class="orb-wrap">
    <div class="orb" id="orb"><div class="cursor" id="cursor"></div><div class="orb-labels"><span class="l">Dark</span><span class="r">Bright</span><span class="t">Pad</span><span class="b">Pluck</span></div></div>
    <div class="readout" id="readout">Brightness 50 · Pad 55 · Depth 55</div><div class="hint">drag: bright/dark + pad/pluck · wheel/pinch: depth · tap: tone</div>
  </div></div>
  <div class="bottom" id="mixerRack">
    <div class="param"><div class="param-head"><div class="pad-name"><button class="mix-toggle active" data-sound="pad" data-label="Pad">Pad</button><button class="edit-btn" data-editor="padEditor">Edit</button></div><output id="padOut">22</output></div><input id="pad" type="range" min="0" max="100" value="22"></div>
    <div class="param"><div class="param-head"><div class="pad-name"><button class="mix-toggle active" data-sound="tones" data-label="Pluck">Pluck</button><button class="edit-btn" data-editor="pluckEditor">Edit</button></div><output id="pluckOut">52</output></div><input id="pluck" type="range" min="0" max="100" value="52"></div>
    <div class="param"><div class="param-head"><div class="pad-name"><button class="mix-toggle active" data-sound="birds" data-label="Bird">Bird</button><button class="edit-btn" data-editor="birdEditor">Edit</button></div><output id="birdOut">38</output></div><input id="bird" type="range" min="0" max="100" value="38"></div>
    <div class="param"><div class="param-head"><button class="mix-toggle active" data-sound="rain" data-label="Rain">Rain</button><output id="rainOut">12</output></div><input id="rain" type="range" min="0" max="100" value="12"></div>
    <div class="param"><div class="param-head"><button class="mix-toggle active" data-sound="wind" data-label="Wind">Wind</button><output id="windOut">20</output></div><input id="wind" type="range" min="0" max="100" value="20"></div>
    <div class="param"><div class="param-head"><div class="pad-name"><button class="mix-toggle active" data-sound="delay" data-label="Delay">Delay</button><button class="edit-btn" data-editor="delayEditor">Edit</button></div><output id="delayOut">42</output></div><input id="delay" type="range" min="0" max="100" value="42"></div>
    <div class="param"><div class="param-head"><div class="pad-name"><button class="mix-toggle active" data-sound="space" data-label="Space">Space</button><button class="edit-btn" data-editor="spaceEditor">Edit</button></div><output id="spaceOut">68</output></div><input id="space" type="range" min="0" max="100" value="68"></div>
    <div class="master"><label>Master <output id="masterOut">72</output></label><input id="master" type="range" min="0" max="100" value="72"></div>
    <div class="sound-editor hidden" id="padEditor">

$('#save').onclick=()=>{localStorage.setItem('forestAmbientPreset',JSON.stringify(state));toast('Saved locally')}; $('#load').onclick=()=>{try{const s=JSON.parse(localStorage.getItem('forestAmbientPreset'));if(s){if(s.character==null&&s.activity!=null)s.character=s.activity;delete s.density;const incoming={...(s.soundOn||{})};if(incoming.drone!=null&&incoming.pad==null)incoming.pad=incoming.drone;delete incoming.drone;const sounds={...state.soundOn,...incoming};delete s.wander;Object.assign(state,s);state.muted=false;state.soundOn=sounds;if(state.scaleKey&&state.scaleKey.startsWith('d-'))state.scaleKey=state.scaleKey.slice(2);if(state.scaleKey==='aeolian')state.scaleKey='natural-minor';if(!scaleDefs[state.scaleKey])state.scaleKey='minor-pent';state.keyRoot=Number.isFinite(Number(state.keyRoot))?Number(state.keyRoot):2;if(state.pad==null)state.pad=.22;if(state.padTone==null)state.padTone=.34;if(state.padMotion==null)state.padMotion=.28;if(state.padSpread==null)state.padSpread=.52;if(state.pluck==null)state.pluck=.52;if(state.pluckTone==null)state.pluckTone=.50;if(state.pluckDecay==null)state.pluckDecay=.50;if(state.bird==null)state.bird=.38;if(state.birdPitch==null)state.birdPitch=.50;if(state.birdWild==null)state.birdWild=.50;if(state.delay==null)state.delay=.42;if(state.delayFeedback==null)state.delayFeedback=.55;if(state.delayTone==null)state.delayTone=.55;if(!['digital','pingpong','slap','dotted','dub','multitap'].includes(state.delayType))state.delayType='digital';if(state.spaceDamp==null)state.spaceDamp=.46;if(state.spacePre==null)state.spacePre=.30;if(!['hall','plate','spring','chamber','cave','cathedral','shimmer'].includes(state.spaceType))state.spaceType='hall';if(!soundPalettes[state.soundPalette])state.soundPalette='canopy';if(!soundPalettes[state.padPalette])state.padPalette=state.soundPalette;if(!soundPalettes[state.pluckPalette])state.pluckPalette=state.soundPalette;if(!soundPalettes[state.birdPalette])state.birdPalette=state.soundPalette;if(!timeThemes[state.timeOfDay])state.timeOfDay='morning';applyTimeTheme(state.timeOfDay);if(started)rebuildSpace();syncUI();updateAudio();toast('Loaded')}}catch{toast('No saved preset')}};
const orb=$('#orb'),cursor=$('#cursor'),readout=$('#readout'); let dragging=false,moved=false,down={x:0,y:0};
function orbSet(e){const r=orb.getBoundingClientRect();state.brightness=clamp((e.clientX-r.left)/r.width);state.character=clamp(1-(e.clientY-r.top)/r.height);syncUI();updateAudio()}
orb.addEventListener('pointerdown',e=>{dragging=true;moved=false;down={x:e.clientX,y:e.clientY};orb.setPointerCapture(e.pointerId)}); orb.addEventListener('pointermove',e=>{if(!dragging)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;orbSet(e)}); orb.addEventListener('pointerup',e=>{if(!moved)particle(true);dragging=false});
orb.addEventListener('wheel',e=>{e.preventDefault();state.depth=clamp(state.depth-e.deltaY*.001);syncUI();updateAudio()},{passive:false});
let pinch=null;orb.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});orb.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);state.depth=clamp(state.depth+(d-pinch)*.002);pinch=d;syncUI();updateAudio()}},{passive:true});
$('#startBtn').onclick=async()=>{if(!started){started=true;initAudio()}if(ac.state==='suspended')await ac.resume();outputReady=true;playing=true;const now=ac.currentTime;nextParticleAt=now+1.2;nextBirdAt=now+4;syncUI();updateAudio(false);$('#start').classList.add('hidden')};
// visual forest
const cvs=$('#forest'),ctx=cvs.getContext('2d');let W=0,H=0,dpr=1,particles=[];function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
for(let i=0;i<85;i++)particles.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.8,v:.05+Math.random()*.18,a:.05+Math.random()*.18});let pulse=0;function flash(){pulse=1}
function draw(t){const blend=(a,b,k)=>a+(b-a)*k;['glow','fog','particle'].forEach(k=>{for(let i=0;i<3;i++)visualTheme[k][i]=blend(visualTheme[k][i],visualTarget[k][i],.0028)});ctx.clearRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.34,20,W*.5,H*.45,Math.max(W,H)*.7),gl=visualTheme.glow;const lift=.72+state.brightness*.50;g.addColorStop(0,`rgba(${Math.round(gl[0]*lift)},${Math.round(gl[1]*lift)},${Math.round(gl[2]*lift)},.31)`);g.addColorStop(1,'rgba(1,5,7,.05)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const fog=8+state.depth*20,fg=visualTheme.fog;for(let i=0;i<4;i++){const y=H*(.35+i*.13)+Math.sin(t*.00008+i)*22;const grad=ctx.createLinearGradient(0,y-50,0,y+50);grad.addColorStop(0,`rgba(${fg[0]|0},${fg[1]|0},${fg[2]|0},0)`);grad.addColorStop(.5,`rgba(${fg[0]|0},${fg[1]|0},${fg[2]|0},${.012+state.depth*.012})`);grad.addColorStop(1,`rgba(${fg[0]|0},${fg[1]|0},${fg[2]|0},0)`);ctx.fillStyle=grad;ctx.fillRect(0,y-50,W,100+fog)}
 const pt=visualTheme.particle;particles.forEach(p=>{p.y-=p.v*(.55+state.character*.75);p.x+=Math.sin(t*.0003+p.y)*.08;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}ctx.beginPath();ctx.fillStyle=`rgba(${pt[0]|0},${pt[1]|0},${pt[2]|0},${p.a*(.4+state.brightness*.8)})`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}); if(pulse>.01){ctx.beginPath();ctx.arc(W*.5,H*.42,70+(1-pulse)*210,0,Math.PI*2);ctx.strokeStyle=`rgba(${pt[0]|0},${pt[1]|0},${pt[2]|0},${pulse*.10})`;ctx.stroke();pulse*=.93} requestAnimationFrame(draw)}applyTimeTheme(state.timeOfDay);requestAnimationFrame(draw);syncUI();

// Mobile two-screen UI: keep performance controls and mixer separate without page scrolling.
function setMobileView(view){
 const app=$('#app'),scene=$('#sceneTab'),mix=$('#mixTab');if(!app||!scene||!mix)return;
 view=view==='mix'?'mix':'scene';app.dataset.mobileView=view;
 scene.classList.toggle('active',view==='scene');mix.classList.toggle('active',view==='mix');
 scene.setAttribute('aria-selected',view==='scene'?'true':'false');mix.setAttribute('aria-selected',view==='mix'?'true':'false');
 if(view==='scene')document.querySelectorAll('.sound-editor').forEach(x=>x.classList.add('hidden'));if(!matchMedia('(max-width:700px)').matches)restoreEditorOrder();
 requestAnimationFrame(()=>{resize();});
}
$('#sceneTab')?.addEventListener('click',()=>setMobileView('scene'));
$('#mixTab')?.addEventListener('click',()=>setMobileView('mix'));
setMobileView('scene');
// iOS Safari lifecycle: resume Web Audio only after a user gesture / foreground return.
const resumeForIOS=async()=>{if(started&&playing&&ac&&ac.state==='suspended'){try{await ac.resume();updateAudio(false)}catch(_){}}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeForIOS()});
window.addEventListener('pageshow',resumeForIOS);
document.addEventListener('touchend',resumeForIOS,{passive:true});
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{resize()},{passive:true});}

})();
